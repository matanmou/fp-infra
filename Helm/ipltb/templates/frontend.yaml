apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipltb-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipltb-frontend
  template:
    metadata:
      labels:
        app: ipltb-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          env:
            - name: BACKEND_URL
              value: {{ .Values.frontend.backendUrl | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ipltb-frontend
spec:
  type: NodePort
  selector:
    app: ipltb-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
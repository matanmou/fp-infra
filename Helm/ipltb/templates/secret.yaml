apiVersion: v1
kind: Secret
metadata:
  name: ipltb-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ required "mysql.rootPassword is missing - did you run with -f secrets.yaml?" .Values.mysql.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  MYSQL_USER: {{ .Values.mysql.user | quote }}
  MYSQL_PASSWORD: {{ required "mysql.password is missing - did you run with -f secrets.yaml?" .Values.mysql.password | quote }}
replicas: 2
namespace: ipltb-space
image:
  name: matanmo93/ipltb
  tag: latest
mysql:
  enabled: true
  image: mysql:8.0
  rootPassword: ""
  password: ""
  database: ipldb
  user: matanmo
  storage: 1Gi
backend:
  serviceName: ipltb-backend
  image: matanmo93/fp-backend:1.4
  port: 3000
  dbHost: ipldb-mysql
  healthPath: "" 
frontend:
  serviceName: ipltb-frontend
  image: matanmo93/fp-frontend:1.2.7
  port: 80
  backendUrl: http://ipltb-backend:3000
secret:
  create: true
ingress:
  enabled: true
  className: nginx
  annotations: {}
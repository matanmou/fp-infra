apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ipltb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/matanmou/fp-infra
    targetRevision: main
    path: Helm/ipltb
    helm:
      releaseName: ipltb
      parameters:
        - name: secret.create
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: ipltb-space
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
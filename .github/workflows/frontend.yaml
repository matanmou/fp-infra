
name: Triggered from fp-app Frontend CI/CD
on:
  repository_dispatch:
    types: [frontend-updated]

jobs:
  get-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo "Got trigger from fp-app Frontend CI/CD, starting frontend deployment..."
  make-docker-image:
    runs-on: ubuntu-latest
    needs: get-trigger
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: matanmo93
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            matanmo93/fp-frontend:latest
            matanmo93/fp-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
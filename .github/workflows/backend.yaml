
name: Triggered from fp-app Backend CI/CD
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      deployed-image:
        description: "The image that was deployed"
        value: ${{ jobs.deploy.outputs.image }}

jobs:
  make-docker-image-to-dockerhub:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: matanmo93
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./Docker/backend
          push: true
          tags: |
            matanmo93/fp-backend:latest
            matanmo93/fp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max